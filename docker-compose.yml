services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: help-motivate-me:local
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      SingleUser__Username: ${SINGLE_USER_USERNAME:?Set SINGLE_USER_USERNAME in .env}
      SingleUser__Password: ${SINGLE_USER_PASSWORD:?Set SINGLE_USER_PASSWORD in .env}
      SingleUser__DisplayName: ${SINGLE_USER_DISPLAY_NAME:-}
      AI__Provider: ${AI_PROVIDER:-OpenAI}
      AI__ApiKey: ${AI_API_KEY:-}
      AI__BaseUrl: ${AI_BASE_URL:-https://api.openai.com/v1/}
      AI__ChatModel: ${AI_CHAT_MODEL:-gpt-4.1-mini}
      AI__EnableTranscription: ${AI_ENABLE_TRANSCRIPTION:-true}
      AI__TranscriptionModel: ${AI_TRANSCRIPTION_MODEL:-whisper-1}
      AI__InputCostPer1MTokens: ${AI_INPUT_COST_PER_1M_TOKENS:-0.40}
      AI__OutputCostPer1MTokens: ${AI_OUTPUT_COST_PER_1M_TOKENS:-1.60}
      AI__TranscriptionCostPerMinute: ${AI_TRANSCRIPTION_COST_PER_MINUTE:-0.006}
      # Backward-compatible fallback for existing installations.
      OpenAI__ApiKey: ${OPENAI_API_KEY:-}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - helpmotivateme_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  helpmotivateme_data:
